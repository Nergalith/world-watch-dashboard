<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transport | World Watch</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" />
    <link href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Nergalith World Watch home">
          <img src="assets/nergalith-logo-glow.png" alt="" />
          <span>
            <strong>Nergalith</strong>
            <small>World Watch</small>
          </span>
        </a>
        <nav class="nav" aria-label="World Watch pages">
          <a href="index.html">Map</a>
          <a href="events.html">Events</a>
          <a class="active" href="transport.html">Transport</a>
          <a href="sources.html">Sources</a>
        </nav>
        <div class="status-pill">Demo tracks</div>
      </header>

      <main class="transport-layout">
        <section class="page-head">
          <p class="eyebrow">Maritime And Aviation</p>
          <h1>Transport Watch</h1>
          <p>Quick route awareness for important sea lanes, air corridors, chokepoints, and public transponder-style layers. This page stays lightweight for public scanning.</p>
        </section>

        <section class="map-card transport-map">
          <div id="world-map" aria-label="Transport watch map"></div>
          <aside class="map-control-panel">
            <div class="panel-title">Transponders</div>
            <button class="layer-toggle active" data-layer="ships" type="button">Ships</button>
            <button class="layer-toggle active" data-layer="aircraft" type="button">Aircraft</button>
            <button class="layer-toggle active" data-layer="routes" type="button">Routes</button>
          </aside>
        </section>

        <aside class="panel transport-list-panel">
          <div class="panel-head">
            <span>Tracked Routes</span>
            <span>Demo</span>
          </div>
          <div id="transport-list" class="wide-list"></div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
